<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Mukti — by Mukti.</title>
  <desc id="desc">A soft blush-to-lavender banner with an elegant M monogram, subtle floral accents, and Mukti's learning-by-building introduction.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fae8e8"/>
      <stop offset="0.54" stop-color="#f8eef0"/>
      <stop offset="1" stop-color="#eee9f7"/>
    </linearGradient>
    <linearGradient id="monogram" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b86f80"/>
      <stop offset="1" stop-color="#927fae"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fffaf7" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fffaf7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#wash)"/>
  <circle cx="1060" cy="82" r="190" fill="url(#glow)"/>
  <circle cx="80" cy="330" r="175" fill="url(#glow)" opacity=".55"/>
  <path d="M914 278c54-72 94-116 150-137m-94 117c42-3 79 8 119 36m-147-63c8-35 5-66-9-98" fill="none" stroke="#bd8794" stroke-opacity=".28" stroke-width="1.5"/>
  <g fill="#b8798a" fill-opacity=".56" font-family="Georgia,serif">
    <text x="1010" y="96" font-size="23">✿</text>
    <text x="1082" y="226" font-size="16">✧</text>
    <text x="948" y="300" font-size="15">✦</text>
    <text x="1125" y="130" font-size="13">✧</text>
  </g>
  <g transform="translate(76 88)">
    <rect width="104" height="104" rx="28" fill="#fffaf7" fill-opacity=".72" stroke="#fff" stroke-opacity=".9"/>
    <text x="52" y="71" text-anchor="middle" fill="url(#monogram)" font-family="Georgia,'Times New Roman',serif" font-size="61" font-style="italic">M</text>
    <circle cx="84" cy="23" r="3" fill="#c18494"/>
  </g>
  <g fill="#594b55" font-family="'Segoe UI',Arial,sans-serif">
    <text x="76" y="239" font-size="17" letter-spacing="3" fill="#947784">BY MUKTI.</text>
    <text x="212" y="165" font-size="42" font-weight="600" letter-spacing="-.8">Hi, I'm Mukti! <tspan fill="#bd7889">✿</tspan></text>
    <text x="214" y="207" font-family="Georgia,'Times New Roman',serif" font-size="25" font-style="italic" fill="#9d6374">Failing better every day.</text>
    <text x="214" y="242" font-size="16" fill="#766771">Breaking things, learning how they work, and building better technology.</text>
    <text x="214" y="289" font-size="12" letter-spacing="1.25" fill="#8c7d88">COMPUTER SCIENCE STUDENT  ·  SOFTWARE ENGINEERING  ·  COMPUTER VISION  ·  AI</text>
  </g>
  <path d="M76 272h79" stroke="#c08b98" stroke-width="1" stroke-linecap="round"/>
</svg>

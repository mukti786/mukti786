<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Hi, I'm Mukti! ✿</title>
  <desc id="desc">Mukti is pursuing a B.Tech in Computer Science and Engineering at IIIT Naya Raipur, with interests in Software Engineering, Backend Development, Computer Vision and AI. Soft geometric blush and lavender shapes sit beside the text.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBF8F5"/>
      <stop offset=".58" stop-color="#F6F1F2"/>
      <stop offset="1" stop-color="#F1EDF5"/>
    </linearGradient>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C7D2" stop-opacity=".76"/>
      <stop offset="1" stop-color="#D9D0E5" stop-opacity=".68"/>
    </linearGradient>
  </defs>
  <rect x="9" y="9" width="1182" height="412" rx="28" fill="url(#paper)" stroke="#D9D0E5" stroke-width="1.5"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#514A52">
    <text x="72" y="145" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" letter-spacing="-.8">Hi, I'm Mukti! <tspan fill="#C58FA3" font-size="54">✿</tspan></text>
    <path d="M74 174h112" stroke="#C58FA3" stroke-width="2" stroke-linecap="round"/>
    <circle cx="74" cy="174" r="3" fill="#C58FA3"/>
    <text x="74" y="224" font-size="21">I'm pursuing a B.Tech in Computer Science and Engineering</text>
    <text x="74" y="255" font-size="21">at IIIT Naya Raipur.</text>
    <text x="74" y="319" font-size="21">Interested in Software Engineering, Backend Development,</text>
    <text x="74" y="350" font-size="21">Computer Vision and AI.</text>
  </g>

  <g>
    <circle cx="1013" cy="204" r="150" fill="url(#wash)" opacity=".78"/>
    <circle cx="1064" cy="142" r="92" fill="#E8C7D2" opacity=".46"/>
    <circle cx="988" cy="206" r="104" fill="none" stroke="#A88A9E" stroke-opacity=".58" stroke-width="1.4"/>
    <circle cx="988" cy="206" r="70" fill="none" stroke="#A88A9E" stroke-opacity=".36" stroke-width="1.2"/>
    <path d="M873 276c42-86 93-144 185-188m-150 229c74-37 145-44 231-14" fill="none" stroke="#8D7D8D" stroke-opacity=".48" stroke-width="1.4"/>

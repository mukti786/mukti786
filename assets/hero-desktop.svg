  <title id="title">Hi, I'm Mukti! ✿</title>
  <desc id="desc">I'm pursuing a B.Tech in Computer Science and Engineering at IIIT Naya Raipur. I'm interested in software engineering, backend development, computer vision, and artificial intelligence. I enjoy exploring how things work behind the scenes, understanding the ideas behind technology, and turning what I learn into working projects. I'm currently strengthening my foundations in data structures and algorithms, exploring open-source development, and learning to build better, more thoughtful software through experimentation and continuous improvement. ✿</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="620" height="460" viewBox="0 0 620 460" role="img" aria-labelledby="title desc">
  <title id="title">A quiet study in connection</title>
  <desc id="desc">An abstract technical illustration with translucent ivory panels, a delicate grid, connected nodes, and restrained blush, mauve, and lavender shapes.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#f1edf2"/>
    </linearGradient>
    <linearGradient id="lavender" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcd8ea" stop-opacity=".82"/>
      <stop offset="1" stop-color="#c6bfdc" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9c9c7" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c99ca4" stop-opacity=".65"/>
    </linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.5" height="1.5">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#514550" flood-opacity=".12"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#827982" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="10" y="10" width="600" height="440" rx="30" fill="url(#paper)"/>
  <rect x="10" y="10" width="600" height="440" rx="30" fill="url(#grid)"/>
  <circle cx="472" cy="104" r="92" fill="url(#lavender)"/>
  <circle cx="472" cy="104" r="58" fill="none" stroke="#8d829d" stroke-opacity=".35"/>
  <circle cx="472" cy="104" r="28" fill="none" stroke="#8d829d" stroke-opacity=".3"/>
  <path d="M416 130c28-49 65-77 112-85M440 164c51-6 92 8 130 40" fill="none" stroke="#716678" stroke-opacity=".42" stroke-width="1.5"/>

  <g filter="url(#shadow)">
    <rect x="102" y="89" width="362" height="260" rx="18" fill="#fffdf9" stroke="#fff" stroke-width="2"/>
    <path d="M103 126h360" stroke="#e6e0dc"/>
    <circle cx="126" cy="108" r="4" fill="#c99ca4"/>
    <circle cx="142" cy="108" r="4" fill="#d9c79f"/>
    <circle cx="158" cy="108" r="4" fill="#c6bfdc"/>
    <rect x="130" y="153" width="114" height="8" rx="4" fill="#776b77" opacity=".72"/>
    <rect x="130" y="171" width="72" height="5" rx="2.5" fill="#b8afb5"/>
    <path d="M162 230h84m0 0 56-42m-56 42 56 42m0-84h52m-52 84h52" fill="none" stroke="#9e8ba0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="162" cy="230" r="9" fill="#d8cce3" stroke="#8e8099" stroke-width="1.5"/>
    <circle cx="246" cy="230" r="11" fill="#e7c8c6" stroke="#ae7d86" stroke-width="1.5"/>
    <circle cx="302" cy="188" r="7" fill="#c9bfdc" stroke="#8e8099" stroke-width="1.5"/>
    <circle cx="302" cy="272" r="7" fill="#d9c79f" stroke="#a79163" stroke-width="1.5"/>
    <rect x="354" y="177" width="50" height="22" rx="7" fill="#f1edf2" stroke="#cfc5d5"/>
    <rect x="354" y="261" width="50" height="22" rx="7" fill="#f8eeee" stroke="#dfc2c2"/>
    <rect x="130" y="315" width="94" height="5" rx="2.5" fill="#d3c9cd"/>
    <rect x="232" y="315" width="54" height="5" rx="2.5" fill="#d3c9cd"/>
  </g>

  <path d="M74 369h168" stroke="#877b83" stroke-opacity=".5" stroke-width="1"/>
  <circle cx="74" cy="369" r="5" fill="#b87f8a"/>
  <circle cx="242" cy="369" r="5" fill="#aaa0c1"/>
  <path d="M74 385v14m168-14v14" stroke="#877b83" stroke-opacity=".38"/>

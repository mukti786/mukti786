  <title id="title">Hi, I'm Mukti! ✿</title>
  <desc id="desc">Mukti is pursuing a B.Tech in Computer Science and Engineering at IIIT Naya Raipur, with interests in Software Engineering, Backend Development, Computer Vision and AI. Soft geometric blush and lavender shapes sit beneath the text.</desc>
